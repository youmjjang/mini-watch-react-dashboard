<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 목록 | mini-watch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
  <header class="page-header">
    <div>
      <p class="eyebrow">mini-watch general</p>
      <h1>게시글 목록</h1>
    </div>
    <a class="button" href="{{ url_for('posts.new_post') }}">새 글 작성</a>
  </header>

  {% if posts %}
  <div class="post-list">
    {% for post in posts %}
    <article class="post-item">
      <span class="post-id">#{{ post.id }}</span>
      <a href="{{ url_for('posts.post_detail', post_id=post.id) }}">{{ post.title }}</a>
    </article>
    {% endfor %}
  </div>
  {% else %}
  <p class="empty">등록된 게시글이 없습니다.</p>
  {% endif %}
</main>
</body>
</html>
