<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 삭제 | mini-watch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container narrow">
  <section class="card">
    <p class="eyebrow">게시글 #{{ post.id }}</p>
    <h1>게시글 삭제</h1>
    <p><strong>“{{ post.title }}”</strong> 게시글을 정말 삭제하시겠습니까?</p>
    <div class="actions">
      <form method="post">
        <button class="button danger" type="submit">삭제 확인</button>
      </form>
      <a class="button secondary" href="{{ url_for('posts.post_detail', post_id=post.id) }}">취소</a>
    </div>
  </section>
</main>
</body>
</html>
