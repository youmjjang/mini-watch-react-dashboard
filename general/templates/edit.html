<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 수정 | mini-watch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container narrow">
  <p class="eyebrow">게시글 #{{ post_id }}</p>
  <h1>게시글 수정</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form class="card form-card" method="post">
    <label for="title">제목</label>
    <input id="title" name="title" value="{{ title }}">
    <label for="body">내용</label>
    <textarea id="body" name="body" rows="8">{{ body }}</textarea>
    <div class="actions">
      <button class="button" type="submit">수정 저장</button>
      <a class="button secondary" href="{{ url_for('posts.post_detail', post_id=post_id) }}">취소</a>
    </div>
  </form>
</main>
</body>
</html>
