<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ post.title }} | mini-watch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
  <article class="card">
    <p class="eyebrow">게시글 #{{ post.id }}</p>
    <h1>{{ post.title }}</h1>
    <div class="post-body">{{ post.body }}</div>
  </article>
  <nav class="actions">
    <a class="button secondary" href="{{ url_for('posts.index') }}">목록</a>
    <a class="button" href="{{ url_for('posts.edit_post', post_id=post.id) }}">수정</a>
    <a class="button danger" href="{{ url_for('posts.delete_post_route', post_id=post.id) }}">삭제</a>
  </nav>
</main>
</body>
</html>
